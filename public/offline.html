<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F06A1A" />
    <title>Offline · Diwakar Connect</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #FBF8F4;
        color: #1B2440;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; opacity: 0.8; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 24px;
        background: #C84C0A;
        color: #FFFFFF;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #1B2440; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Diwakar Connect needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
