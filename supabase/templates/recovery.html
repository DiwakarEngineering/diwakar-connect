<div style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 520px; margin: 0 auto; color: #151c2c;">
  <div style="padding: 24px 0;">
    <span style="display: inline-block; background: #f06a1a; color: #fff; font-weight: 700; border-radius: 8px; padding: 6px 10px;">Diwakar Connect</span>
  </div>
  <h1 style="font-size: 20px; margin: 0 0 12px;">Reset your password</h1>
  <p style="font-size: 14px; line-height: 1.6; color: #4a5466;">
    Someone asked to reset the password for your Diwakar Connect account. If it was you, choose a new password below.
  </p>
  <p style="margin: 28px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="background: #c84c0a; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 14px;">
      Choose a new password
    </a>
  </p>
  <p style="font-size: 12px; color: #8a919e;">If you didn't ask for this, ignore this email - your password won't change.</p>
</div>
